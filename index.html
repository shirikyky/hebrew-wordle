<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121213">
  <title>וורדל בעברית</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>וורדל בעברית</h1>
    <p class="subtitle">נחשו את המילה — 6 ניסיונות</p>
  </header>

  <main>
    <div id="board" class="board" aria-label="לוח המשחק"></div>
    <div id="message" class="message" aria-live="polite"></div>
    <div id="keyboard" class="keyboard" aria-label="מקלדת עברית"></div>
    <div id="share" class="share hidden">
      <button id="copy-result" type="button">📋 העתקת התוצאה</button>
    </div>
  </main>

  <footer>
    <p>🟩 מקום נכון · 🟨 קיימת במילה · ⬛ לא קיימת</p>
    <p>מילה חדשה בכל יום 🗓️</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
